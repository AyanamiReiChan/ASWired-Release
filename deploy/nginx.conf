# Install within /etc/nginx/sites-enabled (http context).
map $http_upgrade $aswired_connection_upgrade { default upgrade; '' close; }
# Do not log query strings: subscription and enrollment URLs carry credentials.
log_format aswired_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name PANEL_DOMAIN;
    access_log /var/log/nginx/aswired-access.log aswired_safe;
    client_max_body_size 260m;
    location ^~ /api/internal/komari/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:12889;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aswired_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location /mcp {
        proxy_pass http://127.0.0.1:12889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location /.well-known/webauthn {
        proxy_pass http://127.0.0.1:12889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name PROBE_DOMAIN;
    access_log /var/log/nginx/komari-access.log aswired_safe;
    client_max_body_size 32m;
    location / {
        proxy_pass http://127.0.0.1:25774;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aswired_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
